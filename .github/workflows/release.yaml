name: Release

# Started by hand only (ADR-017): pushing a tag starts nothing.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release, for example v0.9.7"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build, package, and draft the release
    runs-on: ubuntu-latest

    env:
      # The input reaches every script through this variable, never by being
      # pasted into a script's text.
      TAG: ${{ inputs.tag }}

    steps:
      - name: Check the tag format
        run: |
          if ! printf '%s' "${TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            printf 'ERROR: tag must look like v1.2.3, got: %s\n' "${TAG}" >&2
            exit 1
          fi

      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0  # Full history for version metadata

      - name: Run Docker-first build
        run: BUILD_VER="${TAG}" ./build/build.sh

      - name: Check the binary reports the tag
        run: |
          version_output="$(.bin/amd64/linux/gralph --version)"
          printf '%s\n' "${version_output}"
          if ! printf '%s\n' "${version_output}" | grep -Fxq "gralph version: ${TAG}"; then
            printf 'ERROR: the binary does not report version %s\n' "${TAG}" >&2
            exit 1
          fi

      - name: Package the archives
        run: BUILD_VER="${TAG}" ./build/package.sh

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${TAG}" --draft --verify-tag --generate-notes .dist/*
