# Template for tasks.yaml. SKILL.md holds the field rules and task-scoping
# guidance; this header covers only how to fill in this file.
#
# - Replace every GENERATE_* token. Copy the task entry once per task.
# - The shared prompt below covers scope, cleanup, task-file rules, and the
#   result line contract; put only task-specific content in each task's
#   `prompt`.
# - Leave `state` empty; Gralph reads an empty state as pending.
# - Comments are not passed to the agent, so drop this header from the
#   generated file.
shared:
  prompt: |
    # GENERATE_PROJECT_NAME

    You are running one task. It follows this prompt, starting with a line
    `<id>: <name>`; everything after that line is the task's own instructions. You
    have no memory of earlier tasks, so check any claim about prior work against
    the repository.

    ## Project

    - Context documents: GENERATE_RELEVANT_PROJECT_DOCUMENT_PATHS_OR_NONE
    - Build and test: GENERATE_TOOLCHAIN_BUILD_AND_TEST_COMMANDS
    - Commits: GENERATE_COMMIT_RULES_OR_DO_NOT_COMMIT

    ## Rules

    - Do only this task, within its stated scope.
    - Never edit or commit `tasks.yaml`.
    - Preserve unrelated changes in the workspace and Git.
    - Clean up anything you created that the task does not keep.
    - Before reporting completed, run the project's own checks (tests, linters, the build) and fix what fails.

    ## Finish

    End with a short report of what changed, each verification command and its
    result, and anything you committed. The last non-blank line of your output
    must be this JSON object, on a single line, with nothing else on that line:

    {"state": "completed", "error": ""}

    `state` is `completed` only when the work, its verification, cleanup, and any
    commit the rules above require all succeeded; otherwise it is `failed`, with a
    one-line `error`.
tasks:
  - id: 1
    name: "GENERATE_SHORT_TASK_TITLE"
    state: ""
    prompt: |
      Objective:
      GENERATE_ONE_SENTENCE_DELIVERABLE_AND_PROJECT_CONTEXT

      Scope and files:
      - GENERATE_EXACT_SOURCE_OR_SUPPORTING_PATHS_AND_ALLOWED_CHANGES
      - GENERATE_RELEVANT_DEPENDENCIES_CONSTRAINTS_AND_NON_GOALS

      Steps:
      1. GENERATE_BOUNDED_IMPLEMENTATION_ACTIONS_FOR_THIS_DELIVERABLE
      2. GENERATE_TASK_SPECIFIC_CLEANUP_OR_OMIT_THIS_STEP

      Verification:
      - Working directory: GENERATE_ACTUAL_VERIFICATION_DIRECTORY
      - Project checks: GENERATE_PROJECT_TEST_LINT_AND_BUILD_COMMANDS
      - Task checks: GENERATE_TASK_SPECIFIC_COMMANDS_OR_NONE
      - Expected outcome: GENERATE_OBSERVABLE_SUCCESS_CONDITION

      Completion criteria:
      - GENERATE_CONCRETE_DELIVERED_BEHAVIOR_AND_RELEVANT_ACCEPTANCE_CHECKS
